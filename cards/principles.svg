<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" fill="none" role="img">
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/><animate attributeName="x1" values="0;.7;0" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.7;1" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="aurv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1B2442"/></pattern>

</defs>
<style>
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
<clipPath id="cl"><rect width="1200" height="330" rx="16"/></clipPath><rect width="1200" height="330" rx="16" fill="#070A14"/><g clip-path="url(#cl)"><circle cx="96" cy="33" r="248" fill="#22D3EE" opacity=".13" filter="url(#blur)"/><circle cx="1104" cy="314" r="248" fill="#8B5CF6" opacity=".20" filter="url(#blur)"/><circle cx="660" cy="363" r="132" fill="#F472B6" opacity=".10" filter="url(#blur)"/><rect width="1200" height="330" fill="url(#dots)"/></g><rect x=".6" y=".6" width="1198.8" height="328.8" rx="16" stroke="url(#aur)" stroke-opacity=".6" stroke-width="1.2"/><text x="40" y="44" font-size="13" font-weight="400" fill="#FBBF24" text-anchor="start" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >ENGINEERING PRINCIPLES</text><g class="fade" style="animation-delay:0.00s"><rect x="40" y="68" width="270" height="114" rx="12" fill="#22D3EE" fill-opacity=".07" stroke="#22D3EE" stroke-opacity=".45"/><circle class="pulse" style="animation-delay:0.0s" cx="64" cy="96" r="5" fill="#22D3EE" filter="url(#glow)"/><text x="80" y="101" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Grounding over fluency</text><text x="62" y="134" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Retrieval + reranking; every claim</text><text x="62" y="154" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >traces back to a source.</text></g><g class="fade" style="animation-delay:0.12s"><rect x="322" y="68" width="270" height="114" rx="12" fill="#F472B6" fill-opacity=".07" stroke="#F472B6" stroke-opacity=".45"/><circle class="pulse" style="animation-delay:0.3s" cx="346" cy="96" r="5" fill="#F472B6" filter="url(#glow)"/><text x="362" y="101" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Safety gates first</text><text x="344" y="134" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Crisis detection runs ahead of</text><text x="344" y="154" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >the LLM, never improvised on.</text></g><g class="fade" style="animation-delay:0.24s"><rect x="604" y="68" width="270" height="114" rx="12" fill="#8B5CF6" fill-opacity=".07" stroke="#8B5CF6" stroke-opacity=".45"/><circle class="pulse" style="animation-delay:0.6s" cx="628" cy="96" r="5" fill="#8B5CF6" filter="url(#glow)"/><text x="644" y="101" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Observable agents</text><text x="626" y="134" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Live tool-call traces over SSE,</text><text x="626" y="154" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >so reasoning is inspectable.</text></g><g class="fade" style="animation-delay:0.36s"><rect x="886" y="68" width="270" height="114" rx="12" fill="#FBBF24" fill-opacity=".07" stroke="#FBBF24" stroke-opacity=".45"/><circle class="pulse" style="animation-delay:0.9s" cx="910" cy="96" r="5" fill="#FBBF24" filter="url(#glow)"/><text x="926" y="101" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Provider independence</text><text x="908" y="134" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Routing across Groq, Gemini and</text><text x="908" y="154" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >OpenRouter beats vendor lock-in.</text></g><g class="fade" style="animation-delay:0.48s"><rect x="40" y="194" width="270" height="114" rx="12" fill="#34D399" fill-opacity=".07" stroke="#34D399" stroke-opacity=".45"/><circle class="pulse" style="animation-delay:1.2s" cx="64" cy="222" r="5" fill="#34D399" filter="url(#glow)"/><text x="80" y="227" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Multimodal by default</text><text x="62" y="260" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Face, posture, voice and text are</text><text x="62" y="280" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >fused signals, not separate demos.</text></g><g class="fade" style="animation-delay:0.60s"><rect x="322" y="194" width="270" height="114" rx="12" fill="#22D3EE" fill-opacity=".07" stroke="#22D3EE" stroke-opacity=".45"/><circle class="pulse" style="animation-delay:1.5s" cx="346" cy="222" r="5" fill="#22D3EE" filter="url(#glow)"/><text x="362" y="227" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Resilient automation</text><text x="344" y="260" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >n8n flows ship with retries and</text><text x="344" y="280" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >an error-notifier workflow.</text></g><g class="fade" style="animation-delay:0.72s"><rect x="604" y="194" width="270" height="114" rx="12" fill="#F472B6" fill-opacity=".07" stroke="#F472B6" stroke-opacity=".45"/><circle class="pulse" style="animation-delay:1.8s" cx="628" cy="222" r="5" fill="#F472B6" filter="url(#glow)"/><text x="644" y="227" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Incremental delivery</text><text x="626" y="260" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Progressively harder versions,</text><text x="626" y="280" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >each one working end to end.</text></g><g class="fade" style="animation-delay:0.84s"><rect x="886" y="194" width="270" height="114" rx="12" fill="#8B5CF6" fill-opacity=".07" stroke="#8B5CF6" stroke-opacity=".45"/><circle class="pulse" style="animation-delay:2.1s" cx="910" cy="222" r="5" fill="#8B5CF6" filter="url(#glow)"/><text x="926" y="227" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Ship. Measure. Improve.</text><text x="908" y="260" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Build. Evaluate. Optimize.</text><text x="908" y="280" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Deploy. Repeat.</text></g>
</svg>