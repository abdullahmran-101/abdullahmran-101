<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" fill="none" role="img">
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/><animate attributeName="x1" values="0;.7;0" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.7;1" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="aurv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1B2442"/></pattern>

</defs>
<style>
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
<clipPath id="cl"><rect width="1200" height="200" rx="16"/></clipPath><rect width="1200" height="200" rx="16" fill="#070A14"/><g clip-path="url(#cl)"><circle cx="96" cy="20" r="150" fill="#22D3EE" opacity=".13" filter="url(#blur)"/><circle cx="1104" cy="190" r="150" fill="#8B5CF6" opacity=".20" filter="url(#blur)"/><circle cx="660" cy="220" r="80" fill="#F472B6" opacity=".10" filter="url(#blur)"/><rect width="1200" height="200" fill="url(#dots)"/></g><rect x=".6" y=".6" width="1198.8" height="198.8" rx="16" stroke="url(#aur)" stroke-opacity=".6" stroke-width="1.2"/><text x="40" y="44" font-size="13" font-weight="400" fill="#F472B6" text-anchor="start" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >WORK WITH ME</text><g class="fade" style="animation-delay:0.00s"><rect x="40" y="66" width="270" height="108" rx="12" fill="#22D3EE" fill-opacity=".07" stroke="#22D3EE" stroke-opacity=".5"/><rect x="40" y="66" width="270" height="4" rx="2" fill="#22D3EE" filter="url(#glow)"/><text x="62" y="104" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Full-time role</text><text x="62" y="130" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >AI/ML engineering, applied GenAI,</text><text x="62" y="150" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >backend intelligence.</text></g><g class="fade" style="animation-delay:0.15s"><rect x="322" y="66" width="270" height="108" rx="12" fill="#8B5CF6" fill-opacity=".07" stroke="#8B5CF6" stroke-opacity=".5"/><rect x="322" y="66" width="270" height="4" rx="2" fill="#8B5CF6" filter="url(#glow)"/><text x="344" y="104" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Contract build</text><text x="344" y="130" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >RAG systems, agents, LLM apps,</text><text x="344" y="150" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >computer vision pipelines.</text></g><g class="fade" style="animation-delay:0.30s"><rect x="604" y="66" width="270" height="108" rx="12" fill="#F472B6" fill-opacity=".07" stroke="#F472B6" stroke-opacity=".5"/><rect x="604" y="66" width="270" height="4" rx="2" fill="#F472B6" filter="url(#glow)"/><text x="626" y="104" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Automation</text><text x="626" y="130" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >n8n and Zapier workflows with</text><text x="626" y="150" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >LLM decision steps.</text></g><g class="fade" style="animation-delay:0.45s"><rect x="886" y="66" width="270" height="108" rx="12" fill="#34D399" fill-opacity=".07" stroke="#34D399" stroke-opacity=".5"/><rect x="886" y="66" width="270" height="4" rx="2" fill="#34D399" filter="url(#glow)"/><text x="908" y="104" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Prototype to production</text><text x="908" y="130" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Notebook or demo to a FastAPI</text><text x="908" y="150" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >service with Docker deploy.</text></g>
</svg>