<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" fill="none" role="img">
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/><animate attributeName="x1" values="0;.7;0" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.7;1" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="aurv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1B2442"/></pattern>

</defs>
<style>
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

.sq{animation:sq 2.8s ease-in-out infinite}
@keyframes sq{0%,100%{opacity:.2}50%{opacity:1}}
.sl{animation:sl 3s ease-in-out infinite}
@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
</style>
<g transform="translate(6,6)"><clipPath id="cl"><rect width="388" height="288" rx="16"/></clipPath><rect width="388" height="288" rx="16" fill="#070A14"/><g clip-path="url(#cl)"><circle cx="31" cy="29" r="216" fill="#22D3EE" opacity=".13" filter="url(#blur)"/><circle cx="357" cy="274" r="216" fill="#8B5CF6" opacity=".20" filter="url(#blur)"/><circle cx="213" cy="317" r="115" fill="#F472B6" opacity=".10" filter="url(#blur)"/><rect width="388" height="288" fill="url(#dots)"/></g><rect x=".6" y=".6" width="386.8" height="286.8" rx="16" stroke="url(#aur)" stroke-opacity=".6" stroke-width="1.2"/><text x="28" y="42" font-size="13" font-weight="400" fill="#8B5CF6" text-anchor="start" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >02 / BUILDER</text><line x1="28" y1="58" x2="360" y2="58" stroke="#8B5CF6" stroke-opacity=".35"/><text class="rise" style="animation-delay:0.4s" x="28" y="150" font-size="76" font-weight="800" fill="#8B5CF6" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" filter="url(#glow)">12</text><text x="28" y="176" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >SHIPPED SYSTEMS</text><text class="fade" style="animation-delay:1.0s" x="28" y="214" font-size="14" font-weight="400" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >FastAPI · Django · Celery · Docker</text><text class="fade" style="animation-delay:1.2000000000000002s" x="28" y="236" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >RAG apps, agents, automation APIs</text><text class="fade" style="animation-delay:1.4s" x="28" y="258" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >From prototype to deployed product</text><rect class="sl" style="animation-delay:0.0s" x="282" y="84" width="64" height="12" rx="3" fill="none" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glow)"/><rect class="sl" style="animation-delay:0.35s" x="292" y="102" width="64" height="12" rx="3" fill="none" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glow)"/><rect class="sl" style="animation-delay:0.7s" x="282" y="120" width="64" height="12" rx="3" fill="none" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glow)"/><rect class="sl" style="animation-delay:1.0499999999999998s" x="292" y="138" width="64" height="12" rx="3" fill="#8B5CF6" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glow)"/></g><line x1="6" y1="156" x2="0" y2="156" stroke="#8B5CF6" stroke-width="2"/><circle class="pulse" cx="6" cy="156" r="3.5" fill="#8B5CF6" filter="url(#glow)"/><line x1="394" y1="156" x2="400" y2="156" stroke="#8B5CF6" stroke-width="2"/><circle class="pulse" cx="394" cy="156" r="3.5" fill="#8B5CF6" filter="url(#glow)"/>
</svg>