<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150" fill="none" role="img">
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/><animate attributeName="x1" values="0;.7;0" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.7;1" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="aurv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1B2442"/></pattern>

</defs>
<style>
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
<g transform="translate(6,6)"><clipPath id="cl"><rect width="288" height="138" rx="16"/></clipPath><rect width="288" height="138" rx="16" fill="#070A14"/><g clip-path="url(#cl)"><circle cx="23" cy="14" r="104" fill="#22D3EE" opacity=".13" filter="url(#blur)"/><circle cx="265" cy="131" r="104" fill="#8B5CF6" opacity=".20" filter="url(#blur)"/><circle cx="158" cy="152" r="55" fill="#F472B6" opacity=".10" filter="url(#blur)"/><rect width="288" height="138" fill="url(#dots)"/></g><rect x=".6" y=".6" width="286.8" height="136.8" rx="16" stroke="url(#aur)" stroke-opacity=".6" stroke-width="1.2"/><text class="rise" style="animation-delay:0.15s" x="24" y="84" font-size="54" font-weight="800" fill="#22D3EE" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" filter="url(#glow)">12</text><text x="24" y="114" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >SYSTEMS SHIPPED</text><circle class="tw" style="animation-delay:0.00s" cx="190" cy="40" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:0.25s" cx="210" cy="40" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:0.50s" cx="230" cy="40" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:0.75s" cx="250" cy="40" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:1.00s" cx="190" cy="60" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:1.25s" cx="210" cy="60" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:1.50s" cx="230" cy="60" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:1.75s" cx="250" cy="60" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:2.00s" cx="190" cy="80" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:2.25s" cx="210" cy="80" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:2.50s" cx="230" cy="80" r="5" fill="#22D3EE" filter="url(#glow)"/><circle class="tw" style="animation-delay:2.75s" cx="250" cy="80" r="5" fill="#22D3EE" filter="url(#glow)"/></g>
</svg>