<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" fill="none" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1C1C"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1C1C1C"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<style>
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
<rect width="1200" height="110" rx="14" fill="#0A0A0A"/><rect width="1200" height="110" rx="14" fill="url(#bg)" opacity=".7"/><rect width="1200" height="110" rx="14" fill="url(#dots)"/><rect x=".5" y=".5" width="1199" height="109" rx="14" stroke="#777777" stroke-opacity=".35"/><text x="600" y="52" font-size="14" font-weight="400" fill="#B3B3B3" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" textLength="900">THE MODEL IS THE EASY PART. THE SYSTEM AROUND IT IS THE PRODUCT.</text><line x1="40" y1="76" x2="1160" y2="76" stroke="#777777" stroke-opacity=".25"/><rect x="40" y="75" width="90" height="2" fill="url(#beam)"><animateTransform attributeName="transform" type="translate" from="0 0" to="1030 0" dur="5s" repeatCount="indefinite"/></rect><text x="600" y="98" font-size="11" font-weight="400" fill="#777777" text-anchor="middle" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >ABDULLAH IMRAN  ·  LAHORE</text>
</svg>