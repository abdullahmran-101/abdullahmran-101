ength="690" lengthAdjust="spacingAndGlyphs">ABDULLAH IMRAN</text><rect class="scan" x="70" y="150" width="740" height="2" fill="url(#beam)"/><text class="fade" style="animation-delay:0.9s" x="70" y="330" font-size="17" font-weight="400" fill="#E5E5E5" text-anchor="start" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" textLength="740">AI/ML ENGINEER  ×  COMPUTER VISION  ×  INTELLIGENT PRODUCT DEVELOPMENT</text><text class="fade" style="animation-delay:1.2s" x="70" y="374" font-size="22" font-weight="400" fill="#B3B3B3" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Build systems that survive contact with reality.</text><text x="70" y="418" font-size="12" font-weight="400" fill="#777777" text-anchor="start" letter-spacing="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >LAHORE, PK  ·  REMOTE</text><text x="1152" y="418" font-size="12" font-weight="400" fill="#777777" text-anchor="end" letter-spacing="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >12 SHIPPED SYSTEMS</text><text x="900" y="128" font-size="11" font-weight="400" fill="#777777" text-anchor="start" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" textLength="252">PERCEPTION  →  REASONING  →  ACTION</text><line x1="900" y1="150.0" x2="1010" y2="150.0" stroke="#777777" stroke-opacity=".28"/><line x1="900" y1="150.0" x2="1010" y2="192.5" stroke="#777777" stroke-opacity=".28"/><line x1="900" y1="150.0" x2="1010" y2="235.0" stroke="#777777" stroke-opacity=".28"/><line x1="900" y1="150.0" x2="1010" y2="277.5" stroke="#777777" stroke-opacity=".28"/><line x1="900" y1="150.0" x2="1010" y2="320.0" stroke="#777777" stroke-opacity=".28"/><line x1="900" y1="206.7" x2="1010" y2="150.0" stroke="#777777" stroke-opacity=".28"/><line x1="900" y1="206.7" x2="1010" y2="192.5