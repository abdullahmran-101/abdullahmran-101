<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" fill="none" role="img">
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#5E8FD0"/><stop offset=".5" stop-color="#D8C3A0"/><stop offset="1" stop-color="#B24A5C"/><animate attributeName="x1" values="0;.7;0" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.7;1" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="aurv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B24A5C"/><stop offset=".5" stop-color="#D8C3A0"/><stop offset="1" stop-color="#5E8FD0"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5E8FD0" stop-opacity="0"/><stop offset=".5" stop-color="#5E8FD0"/><stop offset="1" stop-color="#5E8FD0" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".01"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8C3A0" stop-opacity=".45"/><stop offset="1" stop-color="#D8C3A0" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1B2442"/></pattern>

</defs>
<style>
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
.sq{animation:sq 2.4s ease-in-out infinite}@keyframes sq{0%,100%{opacity:.3}50%{opacity:1}}</style>
<g transform="translate(6,6)"><clipPath id="cl"><rect width="588" height="258" rx="16"/></clipPath><rect width="588" height="258" rx="16" fill="#14161A"/><g clip-path="url(#cl)"><circle cx="47" cy="26" r="194" fill="#5E8FD0" opacity=".08" filter="url(#blur)"/><circle cx="541" cy="245" r="194" fill="#D8C3A0" opacity=".10" filter="url(#blur)"/><circle cx="323" cy="284" r="103" fill="#B24A5C" opacity=".07" filter="url(#blur)"/><rect width="588" height="258" fill="url(#glass)"/><rect x="-220" width="140" height="258" fill="url(#shine)" transform="skewX(-18)"><animate attributeName="x" from="-220" to="728" dur="10s" begin="6s" repeatCount="indefinite"/></rect></g><line x1="16" y1=".5" x2="572" y2=".5" stroke="#fff" stroke-opacity=".14"/><rect x=".6" y=".6" width="586.8" height="256.8" rx="16" stroke="url(#aur)" stroke-opacity=".5" stroke-width="1"/><text x="28" y="42" font-size="12" font-weight="400" fill="#5E8FD0" text-anchor="start" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >FEATURED / 02</text><line x1="28" y1="58" x2="560" y2="58" stroke="#323841"/><text class="rise" style="animation-delay:0.2s" x="28" y="104" font-size="32" font-weight="800" fill="url(#aur)" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Cheatify</text><text x="28" y="140" font-size="15" font-weight="400" fill="#F1E8D6" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Real-time exam proctoring with object</text><text x="28" y="162" font-size="15" font-weight="400" fill="#B3ADA0" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >detection, pose and gaze risk scoring.</text><rect x="28" y="184" width="75" height="28" rx="14.0" fill="#5E8FD0" fill-opacity=".10" stroke="#5E8FD0" stroke-opacity=".75"/><text x="65.5" y="202.2" font-size="12" font-weight="400" fill="#F1E8D6" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >YOLOv12</text><rect x="111" y="184" width="89" height="28" rx="14.0" fill="#5E8FD0" fill-opacity=".10" stroke="#5E8FD0" stroke-opacity=".75"/><text x="155.5" y="202.2" font-size="12" font-weight="400" fill="#F1E8D6" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >MediaPipe</text><rect x="208" y="184" width="67" height="28" rx="14.0" fill="#5E8FD0" fill-opacity=".10" stroke="#5E8FD0" stroke-opacity=".75"/><text x="241.5" y="202.2" font-size="12" font-weight="400" fill="#F1E8D6" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >OpenCV</text><text x="28" y="238" font-size="12" font-weight="700" fill="#5E8FD0" text-anchor="start" letter-spacing="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >VIEW REPOSITORY  →</text><path d="M370,170 A80,80 0 0 1 530,170" stroke="#323841" stroke-width="12" stroke-linecap="round"/><path d="M370,170 A80,80 0 0 1 530,170" stroke="url(#aur)" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" filter="url(#glow)"><animate attributeName="stroke-dasharray" values="0 100;72 100;38 100;85 100;0 100" dur="7s" repeatCount="indefinite"/></path><text x="450" y="160" font-size="12" font-weight="400" fill="#B3ADA0" text-anchor="middle" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >RISK</text><rect class="sq" x="410" y="86" width="80" height="44" stroke="#5E8FD0" stroke-width="2" fill="none" filter="url(#glow)"/></g>
