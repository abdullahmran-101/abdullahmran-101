<svg xmlns="http://www.w3.org/2000/svg" width="172" height="60" viewBox="0 0 172 60" fill="none" role="img">
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#6FB08C"/><stop offset=".5" stop-color="#D8C3A0"/><stop offset="1" stop-color="#5E8FD0"/><animate attributeName="x1" values="0;.7;0" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.7;1" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="aurv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E8FD0"/><stop offset=".5" stop-color="#D8C3A0"/><stop offset="1" stop-color="#6FB08C"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6FB08C" stop-opacity="0"/><stop offset=".5" stop-color="#6FB08C"/><stop offset="1" stop-color="#6FB08C" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".01"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8C3A0" stop-opacity=".45"/><stop offset="1" stop-color="#D8C3A0" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1B2442"/></pattern>

</defs>
<style>
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
<g transform="translate(6,6)"><clipPath id="cl"><rect width="160" height="48" rx="16"/></clipPath><rect width="160" height="48" rx="16" fill="#14161A"/><g clip-path="url(#cl)"><circle cx="13" cy="5" r="36" fill="#6FB08C" opacity=".08" filter="url(#blur)"/><circle cx="147" cy="46" r="36" fill="#D8C3A0" opacity=".10" filter="url(#blur)"/><circle cx="88" cy="53" r="19" fill="#5E8FD0" opacity=".07" filter="url(#blur)"/><rect width="160" height="48" fill="url(#glass)"/><rect x="-220" width="140" height="48" fill="url(#shine)" transform="skewX(-18)"><animate attributeName="x" from="-220" to="300" dur="10s" begin="10s" repeatCount="indefinite"/></rect></g><line x1="16" y1=".5" x2="144" y2=".5" stroke="#fff" stroke-opacity=".14"/><rect x=".6" y=".6" width="158.8" height="46.8" rx="16" stroke="url(#aur)" stroke-opacity=".5" stroke-width="1"/><rect x="12" y="10" width="28" height="28" rx="9" fill="#6FB08C" fill-opacity=".16" stroke="#6FB08C"/><text x="26" y="29" font-size="12" font-weight="700" fill="#6FB08C" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >1</text><text x="50" y="29" font-size="13" font-weight="700" fill="#F1E8D6" text-anchor="start" letter-spacing="2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >PANEL</text><circle class="pulse" cx="150" cy="24" r="3" fill="#6FB08C" filter="url(#glow)"/><rect x="12" y="43" width="40" height="2" rx="1" fill="#6FB08C" filter="url(#glow)"><animate attributeName="x" values="12;108;12" dur="4s" begin="0.4s" repeatCount="indefinite"/></rect></g>
</svg>