<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" fill="none" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1C1C"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1C1C1C"/></pattern>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<style>
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
<rect width="1200" height="190" rx="14" fill="#0A0A0A"/><rect width="1200" height="190" rx="14" fill="url(#bg)" opacity=".7"/><rect width="1200" height="190" rx="14" fill="url(#dots)"/><rect x=".5" y=".5" width="1199" height="189" rx="14" stroke="#777777" stroke-opacity=".35"/><text x="40" y="46" font-size="13" font-weight="400" fill="#777777" text-anchor="start" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >// INTRODUCTION</text><text class="rise" style="animation-delay:0.1s" x="40" y="96" font-size="22" font-weight="400" fill="#E5E5E5" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >I design, build and deploy end-to-end intelligent systems: the model, the retrieval layer,</text><text class="rise" style="animation-delay:0.3s" x="40" y="130" font-size="22" font-weight="400" fill="#B3B3B3" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >the agent logic, the backend API and the container it ships in.</text><line x1="40" y1="148" x2="1160" y2="148" stroke="#777777" stroke-opacity=".25"/><text x="40" y="172" font-size="12" font-weight="400" fill="#777777" text-anchor="start" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" textLength="720">PERCEPTION  →  KNOWLEDGE  →  REASONING  →  SERVICE  →  DELIVERY</text>
</svg>