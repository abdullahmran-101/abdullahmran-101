<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" fill="none" role="img">
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/><animate attributeName="x1" values="0;.7;0" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.7;1" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="aurv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1B2442"/></pattern>

</defs>
<style>
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
<clipPath id="cl"><rect width="1200" height="210" rx="16"/></clipPath><rect width="1200" height="210" rx="16" fill="#070A14"/><g clip-path="url(#cl)"><circle cx="96" cy="21" r="158" fill="#22D3EE" opacity=".13" filter="url(#blur)"/><circle cx="1104" cy="200" r="158" fill="#8B5CF6" opacity=".20" filter="url(#blur)"/><circle cx="660" cy="231" r="84" fill="#F472B6" opacity=".10" filter="url(#blur)"/><rect width="1200" height="210" fill="url(#dots)"/></g><rect x=".6" y=".6" width="1198.8" height="208.8" rx="16" stroke="url(#aur)" stroke-opacity=".6" stroke-width="1.2"/><text x="40" y="46" font-size="13" font-weight="400" fill="#22D3EE" text-anchor="start" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >// INTRODUCTION</text><text class="rise" style="animation-delay:0.1s" x="40" y="96" font-size="22" font-weight="400" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >I design, build and deploy end-to-end intelligent systems: the model, the retrieval layer,</text><text class="rise" style="animation-delay:0.3s" x="40" y="130" font-size="22" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >the agent logic, the backend API and the container it ships in.</text><g class="fade" style="animation-delay:0.50s"><rect x="40" y="160" width="97" height="30" rx="15.0" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".75"/><text x="88.5" y="179.2" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >PERCEPTION</text></g><text x="151" y="180" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >→</text><g class="fade" style="animation-delay:0.65s"><rect x="165" y="160" width="89" height="30" rx="15.0" fill="#8B5CF6" fill-opacity=".10" stroke="#8B5CF6" stroke-opacity=".75"/><text x="209.5" y="179.2" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >KNOWLEDGE</text></g><text x="268" y="180" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >→</text><g class="fade" style="animation-delay:0.80s"><rect x="282" y="160" width="89" height="30" rx="15.0" fill="#F472B6" fill-opacity=".10" stroke="#F472B6" stroke-opacity=".75"/><text x="326.5" y="179.2" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >REASONING</text></g><text x="385" y="180" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >→</text><g class="fade" style="animation-delay:0.95s"><rect x="399" y="160" width="75" height="30" rx="15.0" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".75"/><text x="436.5" y="179.2" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >SERVICE</text></g><text x="488" y="180" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >→</text><g class="fade" style="animation-delay:1.10s"><rect x="502" y="160" width="82" height="30" rx="15.0" fill="#34D399" fill-opacity=".10" stroke="#34D399" stroke-opacity=".75"/><text x="543.0" y="179.2" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >DELIVERY</text></g>
</svg>