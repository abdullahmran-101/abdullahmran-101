<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" fill="none" role="img">
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/><animate attributeName="x1" values="0;.7;0" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.7;1" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="aurv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1B2442"/></pattern>

</defs>
<style>
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
.sq{animation:sq 2.4s ease-in-out infinite}@keyframes sq{0%,100%{opacity:.3}50%{opacity:1}}</style>
<g transform="translate(6,6)"><clipPath id="cl"><rect width="588" height="258" rx="16"/></clipPath><rect width="588" height="258" rx="16" fill="#070A14"/><g clip-path="url(#cl)"><circle cx="47" cy="26" r="194" fill="#22D3EE" opacity=".13" filter="url(#blur)"/><circle cx="541" cy="245" r="194" fill="#8B5CF6" opacity=".20" filter="url(#blur)"/><circle cx="323" cy="284" r="103" fill="#F472B6" opacity=".10" filter="url(#blur)"/><rect width="588" height="258" fill="url(#dots)"/></g><rect x=".6" y=".6" width="586.8" height="256.8" rx="16" stroke="url(#aur)" stroke-opacity=".6" stroke-width="1.2"/><text x="28" y="42" font-size="12" font-weight="400" fill="#FBBF24" text-anchor="start" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >FEATURED / 03</text><line x1="28" y1="58" x2="560" y2="58" stroke="#2A3558"/><text class="rise" style="animation-delay:0.30000000000000004s" x="28" y="104" font-size="32" font-weight="800" fill="url(#aur)" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >AgentFlow AI</text><text x="28" y="140" font-size="15" font-weight="400" fill="#F1F5F9" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Multi-provider ReAct platform with live</text><text x="28" y="162" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start" letter-spacing="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >tool traces, memory and failover.</text><rect x="28" y="184" width="89" height="28" rx="14.0" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".75"/><text x="72.5" y="202.2" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >LangGraph</text><rect x="125" y="184" width="45" height="28" rx="14.0" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".75"/><text x="147.5" y="202.2" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >SSE</text><rect x="178" y="184" width="75" height="28" rx="14.0" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".75"/><text x="215.5" y="202.2" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >FastAPI</text><text x="28" y="238" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >VIEW REPOSITORY  →</text><circle cx="450" cy="120" r="52" stroke="#2A3558" stroke-width="2" stroke-dasharray="5 6"/><text x="450" y="124" font-size="14" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >ReAct</text><text x="450" y="64" font-size="10" font-weight="400" fill="#22D3EE" text-anchor="middle" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >THOUGHT</text><text x="520" y="168" font-size="10" font-weight="400" fill="#8B5CF6" text-anchor="start" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >ACTION</text><text x="380" y="168" font-size="10" font-weight="400" fill="#F472B6" text-anchor="end" letter-spacing="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" >OBSERVE</text><g><circle cx="450" cy="68" r="5" fill="#22D3EE" filter="url(#glow)"/><animateTransform attributeName="transform" type="rotate" from="0 450 120" to="360 450 120" dur="5s" repeatCount="indefinite"/></g></g>
</svg>