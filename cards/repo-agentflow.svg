><g><circle cx="450" cy="68" r="5" fill="#6FB08C" filter="url(#glow)"/><animateTransform attributeName="transform" type="rotate" from="0 450 120" to="360 450 120" dur="5s" repeatCount="indefinite"/></g></g>
</svg>