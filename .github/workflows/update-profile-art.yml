name: update-profile-art

on:
  schedule:
    - cron: "17 3 * * *"        # refresh live activity once a day
  workflow_dispatch:             # manual run from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**"]

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install fonttools
      - name: Render cards and README
        run: python scripts/render_readme_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards README.md
          git diff --cached --quiet || (git commit -m "chore: refresh profile cards [skip ci]" && git push)
